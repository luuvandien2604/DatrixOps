name: DatrixOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  agent:
    name: Agent tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 32)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "SETUP_TOKEN=$(openssl rand -hex 32)"
            echo "ALLOWED_ORIGINS=https://ops.example.com"
            echo "PUBLIC_URL=https://ops.example.com"
            echo "CADDY_SITE_ADDRESS=ops.example.com"
            echo "AGENT_VERSION=ci"
            echo "NEXT_PUBLIC_API_URL=/api/v1"
          } > .env
      - run: docker compose --env-file .env -f docker-compose.yml config
      - run: docker compose --env-file .env -f docker-compose.yml build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        if: github.event_name == 'push'
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
      - uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        if: github.event_name == 'pull_request'
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
