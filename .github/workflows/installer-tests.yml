name: Installer & Updater Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  linux-installer:
    name: Linux Installer & Updater Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n frontend/public/install.sh
          bash -n frontend/public/install-mac.sh
          bash -n frontend/public/update-agent.sh
          bash -n deploy/fetch-agent-release.sh
          bash -n scripts/build-agent-release.sh

      - name: Test Linux installer & updater
        run: |
          python3 scripts/mock-server.py &
          sleep 2

          export DATRIXOPS_INSTALLER_TEST_MODE=1
          export DATRIXOPS_INSTALLER_ROOT="$(mktemp -d)"
          export DATRIXOPS_SYSTEMCTL_BIN="$PWD/scripts/mock-systemctl.sh"

          # Test missing required args fails
          if bash frontend/public/install.sh 2>/dev/null; then
            echo "ERROR: installer should fail without args" >&2
            exit 1
          fi

          # Test invalid layout fails
          if bash frontend/public/install.sh --server http://127.0.0.1:8080 --token "$(printf 't%.0s' {1..32})" --agent-version 1.0.1 --agent-artifact-base-url http://127.0.0.1:8080 --agent-release-layout invalid 2>/dev/null; then
            echo "ERROR: installer should reject invalid layout" >&2
            exit 1
          fi

          # Test valid arguments in test mode
          bash frontend/public/install.sh \
            --server http://127.0.0.1:8080 \
            --token "$(printf 't%.0s' {1..32})" \
            --agent-version 1.0.1 \
            --agent-artifact-base-url http://127.0.0.1:8080 \
            --agent-release-layout github

          # Setup baseline v1.0.0 fixture to test update
          mkdir -p "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin"
          echo "OLD_BINARY_1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent"
          mkdir -p "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops"
          echo "AGENT_VERSION=1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"

          # Scenario 1: Successful update (1.0.0 -> 1.0.1)
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          bash frontend/public/update-agent.sh \
            --target-version 1.0.1 \
            --target-artifact-base-url http://127.0.0.1:8080
          grep -q 'AGENT_VERSION=1.0.1' "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"

          # Scenario 2: Correct SHA with wrong size metadata must fail before activation
          echo "OLD_BINARY_1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent"
          echo "AGENT_VERSION=1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080/wrong-size; then
            echo "ERROR: updater should reject mismatched size metadata" >&2
            exit 1
          fi
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          grep -q 'AGENT_VERSION=1.0.0' "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"
          test ! -e "$DATRIXOPS_INSTALLER_ROOT/mock_systemctl_state_restart_count"

          # Scenario 3: Non-numeric size metadata must fail before download and activation
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080/invalid-size; then
            echo "ERROR: updater should reject non-numeric size metadata" >&2
            exit 1
          fi
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          grep -q 'AGENT_VERSION=1.0.0' "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"
          test ! -e "$DATRIXOPS_INSTALLER_ROOT/mock_systemctl_state_restart_count"

          # Reset fixture back to 1.0.0
          echo "OLD_BINARY_1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent"
          echo "AGENT_VERSION=1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/etc/datrixops/agent.env"

          # Scenario 4: Update restart failure
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          export DATRIXOPS_MOCK_RESTART_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on restart failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_RESTART_FAIL

          # Scenario 5: Update health failure
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on health failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL

          # Scenario 6: Rollback restart failure
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          export DATRIXOPS_MOCK_ROLLBACK_RESTART_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on rollback restart failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL
          unset DATRIXOPS_MOCK_ROLLBACK_RESTART_FAIL

          # Scenario 7: Rollback health failure
          rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_systemctl_state*
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          export DATRIXOPS_MOCK_ROLLBACK_HEALTH_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on rollback health failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL
          unset DATRIXOPS_MOCK_ROLLBACK_HEALTH_FAIL

  macos-installer:
    name: macOS Installer & Updater Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n frontend/public/install.sh
          bash -n frontend/public/install-mac.sh
          bash -n frontend/public/update-agent.sh

      - name: Test macOS installer & updater
        run: |
          python3 scripts/mock-server.py &
          sleep 2

          export DATRIXOPS_INSTALLER_TEST_MODE=1
          export DATRIXOPS_INSTALLER_ROOT="$(mktemp -d)"
          export DATRIXOPS_LAUNCHCTL_BIN="$PWD/scripts/mock-launchctl.sh"

          # Test missing required args fails
          if bash frontend/public/install-mac.sh 2>/dev/null; then
            echo "ERROR: installer should fail without args" >&2
            exit 1
          fi

          # Test invalid layout fails
          if bash frontend/public/install-mac.sh --server http://127.0.0.1:8080 --token "$(printf 't%.0s' {1..32})" --agent-version 1.0.1 --agent-artifact-base-url http://127.0.0.1:8080 --agent-release-layout invalid 2>/dev/null; then
            echo "ERROR: installer should reject invalid layout" >&2
            exit 1
          fi

          # Test valid arguments in test mode
          bash frontend/public/install-mac.sh \
            --server http://127.0.0.1:8080 \
            --token "$(printf 't%.0s' {1..32})" \
            --agent-version 1.0.1 \
            --agent-artifact-base-url http://127.0.0.1:8080 \
            --agent-release-layout default

          reset_macos_fixture() {
            mkdir -p "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin"
            echo "OLD_BINARY_1.0.0" > "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent"
            /usr/libexec/PlistBuddy -c 'Set :EnvironmentVariables:AGENT_VERSION 1.0.0' \
              "$DATRIXOPS_INSTALLER_ROOT/Library/LaunchDaemons/com.datrixops.agent.plist"
            /usr/libexec/PlistBuddy -c 'Set :EnvironmentVariables:DATRIXOPS_AGENT_ARTIFACT_BASE_URL http://127.0.0.1:8080' \
              "$DATRIXOPS_INSTALLER_ROOT/Library/LaunchDaemons/com.datrixops.agent.plist"
            rm -f "$DATRIXOPS_INSTALLER_ROOT"/mock_launchctl_state*
          }

          assert_macos_fixture_version() {
            actual_version="$(/usr/libexec/PlistBuddy -c 'Print :EnvironmentVariables:AGENT_VERSION' \
              "$DATRIXOPS_INSTALLER_ROOT/Library/LaunchDaemons/com.datrixops.agent.plist")"
            if [[ "$actual_version" != "$1" ]]; then
              echo "ERROR: expected plist AGENT_VERSION=$1, got $actual_version" >&2
              exit 1
            fi
          }

          # Setup baseline v1.0.0 fixture to test update
          reset_macos_fixture

          # Scenario 1: Successful update (1.0.0 -> 1.0.1)
          bash frontend/public/update-agent.sh \
            --target-version 1.0.1 \
            --target-artifact-base-url http://127.0.0.1:8080
          assert_macos_fixture_version "1.0.1"

          # Reset fixture back to 1.0.0
          reset_macos_fixture

          # Scenario 2: Update restart failure
          export DATRIXOPS_MOCK_RESTART_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on restart failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_RESTART_FAIL
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          assert_macos_fixture_version "1.0.0"

          # Scenario 3: Update health failure
          reset_macos_fixture
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on health failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          assert_macos_fixture_version "1.0.0"

          # Scenario 4: Rollback restart failure
          reset_macos_fixture
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          export DATRIXOPS_MOCK_ROLLBACK_RESTART_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on rollback restart failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL
          unset DATRIXOPS_MOCK_ROLLBACK_RESTART_FAIL
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          assert_macos_fixture_version "1.0.0"

          # Scenario 5: Rollback health failure
          reset_macos_fixture
          export DATRIXOPS_MOCK_HEALTH_FAIL=1
          export DATRIXOPS_MOCK_ROLLBACK_HEALTH_FAIL=1
          if bash frontend/public/update-agent.sh --target-version 1.0.1 --target-artifact-base-url http://127.0.0.1:8080; then
            echo "ERROR: updater should fail on rollback health failure" >&2
            exit 1
          fi
          unset DATRIXOPS_MOCK_HEALTH_FAIL
          unset DATRIXOPS_MOCK_ROLLBACK_HEALTH_FAIL
          test "$(cat "$DATRIXOPS_INSTALLER_ROOT/usr/local/bin/datrixops-agent")" = "OLD_BINARY_1.0.0"
          assert_macos_fixture_version "1.0.0"

  windows-installer:
    name: Windows Installer & Updater Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts syntax & AST
        shell: pwsh
        run: |
          $scripts = @(
            "frontend/public/install.ps1",
            "frontend/public/update-agent.ps1"
          )
          foreach ($script in $scripts) {
            $errors = $null
            $tokens = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax errors in $script`: $($errors | Out-String)"
              exit 1
            }
            Write-Host "AST validation passed for $script"
          }

      - name: Test Windows installer argument validation & updater Pester
        shell: pwsh
        run: |
          Start-Process -NoNewWindow -FilePath "python" -ArgumentList "scripts/mock-server.py"
          Start-Sleep -Seconds 2

          $env:DATRIXOPS_INSTALLER_TEST_MODE = "1"
          $testRoot = Join-Path $env:RUNNER_TEMP "datrixops-installer-test"
          $env:DATRIXOPS_INSTALLER_ROOT = $testRoot
          $env:DATRIXOPS_MOCK_SCHTASKS_BIN = "$pwd/scripts/mock-schtasks.ps1"
          $testToken = -join ((65..90) + (97..122) | Get-Random -Count 32 | ForEach-Object {[char]$_})

          if (Test-Path $testRoot) {
            Remove-Item -Path $testRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null

          # Test invalid layout fails
          try {
            & ./frontend/public/install.ps1 -Token $testToken -ServerUrl "http://localhost:8080" -AgentVersion "1.0.1" -AgentArtifactBaseUrl "http://localhost:8080" -AgentReleaseLayout "invalid_layout"
            Write-Error "Expected invalid layout to throw"
            exit 1
          } catch {
            Write-Host "Successfully rejected invalid layout"
          }

          # Test valid arguments in test mode
          & ./frontend/public/install.ps1 -Token $testToken -ServerUrl "http://localhost:8080" -AgentVersion "1.0.1" -AgentArtifactBaseUrl "http://localhost:8080" -AgentReleaseLayout "github"

          # Run Pester Tests
          Invoke-Pester -Path ./frontend/public/tests/ -Output Detailed
