name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute development image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build and push Backend, Migrate, Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/luuvandien2604/datrixops-backend:${{ env.IMAGE_TAG }}
            ghcr.io/luuvandien2604/datrixops-migrate:${{ env.IMAGE_TAG }}
            ghcr.io/luuvandien2604/datrixops-worker:${{ env.IMAGE_TAG }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: true
          tags: |
            ghcr.io/luuvandien2604/datrixops-frontend:${{ env.IMAGE_TAG }}
