name: DatrixOps Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Test source
        run: |
          (cd backend && go test ./...)
          (cd agent && go test ./...)
          (cd frontend && npm ci && npm run lint && npx tsc --noEmit --incremental false && npm run build)

      - name: Build and push versioned images
        run: |
          docker buildx build --push \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datrixops-backend:${VERSION}" \
            -f backend/Dockerfile backend
          docker buildx build --push \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datrixops-worker:${VERSION}" \
            -f backend/Dockerfile backend
          docker buildx build --push \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datrixops-frontend:${VERSION}" \
            -f frontend/Dockerfile frontend

      - name: Build signed Agent artifacts
        env:
          AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_SIGNING_PRIVATE_KEY }}
          AGENT_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          AUTO_UPDATE_BACKEND: "0"
          VERIFY_PUBLIC_RELEASE: "0"
        run: ./scripts/publish-agent.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "frontend/public/releases/${VERSION}/"* \
            --generate-notes \
            --verify-tag
