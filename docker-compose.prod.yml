
services:
  gateway:
    image: caddy:2-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Keep the existing public origin port. The gateway now owns it and
      # forwards WebSocket upgrades directly to the Backend.
      - "3000:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: datrixops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: datrixops
    ports:
      # Administrative access remains local to the control-plane host.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datrixops -d datrixops"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AGENT_VERSION=${AGENT_VERSION:?AGENT_VERSION is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    command: ["./migrate_server"]

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AGENT_VERSION=${AGENT_VERSION:?AGENT_VERSION is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - DATRIXOPS_RUN_SCHEDULERS=false
    ports:
      # Public API traffic must enter through the WebSocket-aware gateway.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AGENT_VERSION=${AGENT_VERSION:?AGENT_VERSION is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    command: ["./worker_server"]
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./docs:/app/docs:ro
      # Agent releases are published after the frontend image is built.
      # Keep them runtime-mounted so a release is downloadable before the
      # backend advertises its AGENT_VERSION.
      - ./frontend/public:/app/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    # To make this work properly across networks, you might need to rebuild 
    # the frontend with the correct NEXT_PUBLIC_API_URL pointing to your VPS IP if not using a reverse proxy.

volumes:
  pgdata:
