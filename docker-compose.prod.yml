
# Source-built production-like stack for maintainers and integration checks.
# End-user installations use the version-pinned deploy/docker-compose.yml.
services:
  gateway:
    image: caddy:2-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${DATRIXOPS_HTTP_PORT:-80}:80"
      - "${DATRIXOPS_HTTPS_PORT:-443}:443"
      - "${DATRIXOPS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: datrixops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: datrixops
    ports:
      # Administrative access remains local to the control-plane host.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datrixops -d datrixops"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AGENT_VERSION=${AGENT_VERSION:-1.5.9}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DATRIXOPS_EDITION=${DATRIXOPS_EDITION:-community}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - AGENT_RELEASE_BASE_URL=${AGENT_RELEASE_BASE_URL:-}
      - AGENT_RELEASE_LAYOUT=${AGENT_RELEASE_LAYOUT:-legacy_direct}
      - AGENT_ARTIFACT_BASE_URL=${AGENT_ARTIFACT_BASE_URL:-}
    command: ["./migrate_server"]

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SETUP_TOKEN=${SETUP_TOKEN:?SETUP_TOKEN is required}
      - AGENT_VERSION=${AGENT_VERSION:-1.5.9}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DATRIXOPS_EDITION=${DATRIXOPS_EDITION:-community}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - AGENT_RELEASE_BASE_URL=${AGENT_RELEASE_BASE_URL:-}
      - AGENT_RELEASE_LAYOUT=${AGENT_RELEASE_LAYOUT:-legacy_direct}
      - AGENT_ARTIFACT_BASE_URL=${AGENT_ARTIFACT_BASE_URL:-}
      - ENABLE_PUBLIC_REGISTRATION=${ENABLE_PUBLIC_REGISTRATION:-false}
      - ENABLE_WEB_TERMINAL=${ENABLE_WEB_TERMINAL:-false}
      - ENABLE_REMOTE_SCRIPTS=${ENABLE_REMOTE_SCRIPTS:-false}
      - ENABLE_SERVICE_CONTROLS=${ENABLE_SERVICE_CONTROLS:-false}
      - ENABLE_READ_ONLY_LOGS=${ENABLE_READ_ONLY_LOGS:-false}
      - METRICS_RETENTION_DAYS=${METRICS_RETENTION_DAYS:-7}
      - OPERATIONAL_RETENTION_DAYS=${OPERATIONAL_RETENTION_DAYS:-90}
      - DATRIXOPS_RUN_SCHEDULERS=false
    ports:
      # Public API traffic must enter through the WebSocket-aware gateway.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://datrixops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/datrixops?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AGENT_VERSION=${AGENT_VERSION:-1.5.9}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DATRIXOPS_EDITION=${DATRIXOPS_EDITION:-community}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - AGENT_RELEASE_BASE_URL=${AGENT_RELEASE_BASE_URL:-}
      - AGENT_RELEASE_LAYOUT=${AGENT_RELEASE_LAYOUT:-legacy_direct}
      - AGENT_ARTIFACT_BASE_URL=${AGENT_ARTIFACT_BASE_URL:-}
      - ENABLE_PUBLIC_REGISTRATION=${ENABLE_PUBLIC_REGISTRATION:-false}
      - ENABLE_WEB_TERMINAL=${ENABLE_WEB_TERMINAL:-false}
      - ENABLE_REMOTE_SCRIPTS=${ENABLE_REMOTE_SCRIPTS:-false}
      - ENABLE_SERVICE_CONTROLS=${ENABLE_SERVICE_CONTROLS:-false}
      - ENABLE_READ_ONLY_LOGS=${ENABLE_READ_ONLY_LOGS:-false}
      - METRICS_RETENTION_DAYS=${METRICS_RETENTION_DAYS:-7}
      - OPERATIONAL_RETENTION_DAYS=${OPERATIONAL_RETENTION_DAYS:-90}
    command: ["./worker_server"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./frontend/docs:/app/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # To make this work properly across networks, you might need to rebuild 
    # the frontend with the correct NEXT_PUBLIC_API_URL pointing to your VPS IP if not using a reverse proxy.

volumes:
  pgdata:
